server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: user-auth-service-auth
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: user-auth-service-users
          uri: http://localhost:8081
          predicates:
            - Path=/users/**

        - id: laundry-service
          uri: http://localhost:8082
          predicates:
            - Path=/services/**

        - id: order-pickup-service
          uri: http://localhost:8083
          predicates:
            - Path=/orders/**

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
