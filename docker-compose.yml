services:
  mongodb:
    image: mongo:7.0
    container_name: washflow-mongodb
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ping: 1})' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  user-auth-service:
    build:
      context: ./user-auth-service
      dockerfile: Dockerfile
    container_name: washflow-user-auth-service
    ports:
      - "8081:8081"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - SPRING_MONGODB_URI=${MONGODB_URI}
      - SPRING_DATA_MONGODB_URI=${MONGODB_URI}
      - USER_AUTH_SERVICE_API_KEY=${USER_AUTH_SERVICE_API_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  laundry-service:
    build:
      context: ./laundry-service
      dockerfile: Dockerfile
    container_name: washflow-laundry-service
    ports:
      - "8082:8082"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - SPRING_MONGODB_URI=${MONGODB_URI}
      - SPRING_DATA_MONGODB_URI=${MONGODB_URI}
      - LAUNDRY_SERVICE_API_KEY=${LAUNDRY_SERVICE_API_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: washflow-gateway
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - USER_AUTH_SERVICE_API_KEY=${USER_AUTH_SERVICE_API_KEY}
      - USER_AUTH_SERVICE_URL=http://user-auth-service:8081
      - LAUNDRY_SERVICE_API_KEY=${LAUNDRY_SERVICE_API_KEY}
      - LAUNDRY_SERVICE_URL=http://laundry-service:8082
    depends_on:
      user-auth-service:
        condition: service_healthy
      laundry-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mongodb_data:
